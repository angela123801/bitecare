    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "BiteCare",
        "alternateName": "BiteCare Animal Bite Management and Monitoring System",
        "url": "https://bitecare.com/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web, Android, iOS",
        "inLanguage": "en-PH",
        "description": "An animal bite management, monitoring and decision support system for Bacolod City: bite reporting, treatment center locations, rabies vaccination tracking and first-aid guidance.",
        "areaServed": {
          "@type": "City",
          "name": "Bacolod City",
          "address": {
            "@type": "PostalAddress",
            "addressRegion": "Negros Occidental",
            "addressCountry": "PH"
          }
        },
        "publisher": {
          "@type": "Organization",
          "name": "BiteCare",
          "url": "https://bitecare.com/",
          "logo": "https://bitecare.com/logo.png"
        }
      }
    </script>

    <script>
      // Capture the browser's install prompt as early as possible. The prompt
      // fires once, shortly after load, so a listener attached later inside the
      // app would miss it and the install button would never appear.
      window.__bitecareInstallPrompt = null;
      window.__bitecareInstallListeners = new Set();
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        window.__bitecareInstallPrompt = event;
        window.__bitecareInstallListeners.forEach(function (listener) { listener(true); });
      });
      window.addEventListener('appinstalled', function () {
        window.__bitecareInstallPrompt = null;
        window.__bitecareInstallListeners.forEach(function (listener) { listener(false); });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
